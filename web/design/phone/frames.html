<!doctype html>
<!-- The dev site at three phone sizes, side by side (pnpm dev on :5173). Served by Vite itself: http://localhost:5173/design/phone/frames.html (same origin, so a test can reach each frame's __app). -->
<html><head><meta charset="utf-8"><title>Phone frames</title>
<style>body{margin:0;padding:16px;background:#dfe3da;display:flex;gap:24px;align-items:flex-start;font:12px sans-serif}
figure{margin:0}iframe{border:0;background:#fff;box-shadow:0 0 0 8px #1b1f1d;border-radius:24px}</style></head>
<body>
<figure><iframe id="a" src="/" width="390" height="844"></iframe><figcaption>390 × 844</figcaption></figure>
<figure><iframe id="b" src="/" width="375" height="667"></iframe><figcaption>375 × 667</figcaption></figure>
<figure><iframe id="c" src="/" width="360" height="780"></iframe><figcaption>360 × 780</figcaption></figure>
<script>
// Test helpers for the frames, from the browser console or a driving tool (dev only: needs __app.act).
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = (id) => document.querySelector('#' + id).contentWindow;
/** Reload frame `id` and deal the lineup as it stands (Blue a person, three bots). */
window.seat = async (id) => { frame(id).location.reload(); await wait(3000); const w = frame(id);
  [...w.document.querySelectorAll('button')].find((b) => /Deal/.test(b.textContent)).click(); await wait(2500); return w; };
/** Reload frame `id` and watch four bots. */
window.startBots = async (id, ms = 8000) => { frame(id).location.reload(); await wait(3000); const w = frame(id); const s = w.__app.get();
  w.__app.set({ lineup: s.lineup.map((p) => (p.kind === 'human' ? { ...s.lineup[2] } : p)), pace: 'fast' }); await wait(400);
  [...w.document.querySelectorAll('button')].find((b) => /Deal|Watch/.test(b.textContent)).click(); await wait(ms); return w; };
/** Play the seated person's moves with the heuristic bot until `until(state)` holds. */
window.drive = async (w, until, max = 400) => { for (let i = 0; i < max; i++) { const s = w.__app.get();
  if (until(s)) return { ok: true, i }; if (s.view.winner >= 0) return { ok: false, why: 'over', i };
  if (s.view.current_player === s.human && s.status === 'idle' && s.pendingHandoff == null && s.legal.length) {
    const d = await w.__app.live.decide('heuristic', 1); await w.__app.act(d.action); } else await wait(120); }
  return { ok: false, why: 'max' }; };
</script>
</body></html>
